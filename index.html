function chooseMember(id){if(!roster[id]||attendees[id]!==true)return;member=id;localStorage.setItem('bookclub_member_id',id);draft=(currentBallots()[id]?.books||[]).filter(b=>books[b]?.active);render()}
function booksView(){const active=Object.entries(books).filter(([,b])=>b?.active===true).map(([id,b])=>({id,...b})).sort((a,b)=>String(a.title).localeCompare(String(b.title)));$('book-count').textContent=String(active.length);$('counter').hidden=!member||isAdmin;const my=member?currentBallots()[member]:null;if(my&&draft.length===0)draft=(my.books||[]).filter(id=>books[id]?.active);$('selected').textContent=draft.length;$('voted').hidden=!my;$('voted').textContent=t('saved');const can=!!member&&attendees[member]===true&&!isAdmin&&!settings.locked;$('cast-bar').hidden=!can;$('cast-label').textContent=my?t('edit'):t('cast');$('cast-hint').textContent=draft.length?t('ready'):t('select');$('cast-count').textContent=draft.length;$('cast-btn').disabled=!draft.length;if(!member&&!isAdmin){$('books').innerHTML=`<p class="rounded-xl border bg-white p-8 text-center text-sm text-neutral-500">${attendeeCount()?t('chooseHint'):t('noAttendees')}</p>`;return}if(!active.length){$('books').innerHTML=`<p class="rounded-xl border bg-white p-8 text-center text-sm text-neutral-500">${t('emptySlate')}</p>`;return}$('books').innerHTML=active.map(b=>{const selected=draft.includes(b.id),disabled=!can||(!selected&&draft.length>=3);const badges=[b.bonusPoints>0?`<span title="${t('bonusRule')}" aria-label="${t('bonusRule')}" class="rounded-full border px-2 py-1 text-xs">✚ ${b.bonusPoints}</span>`:'',b.missedCount>0?`<span title="${t('missedRule')}" aria-label="${t('missedRule')}" class="rounded-full border px-2 py-1 text-xs">↻ ${b.missedCount}</span>`:''].join('');return `<button onclick="toggleBook('${esc(b.id)}')" ${disabled?'disabled':''} class="w-full rounded-xl border ${selected?'border-neutral-900 ring-1 ring-neutral-900':'border-[#E2E0D8]'} bg-white p-5 text-left ${settings.locked&&!isAdmin?'pointer-events-none opacity-50':''} ${disabled?'opacity-55':''}"><span class="flex items-start justify-between gap-3"><span class="min-w-0"><b class="serif block line-clamp-2 text-xl">${esc(b.title)}</b><small class="block pt-1 text-neutral-500">${esc(b.proposer||'')}</small></span><span class="flex shrink-0 gap-1">${badges}</span></span></button>`}).join('')}
function toggleBook(id){if(isAdmin||settings.locked||!member)return;const i=draft.indexOf(id);if(i>=0)draft.splice(i,1);else if(draft.length<3)draft.push(id);booksView()}
async function cast(){if(!member||!roster[member]||attendees[member]!==true||settings.locked||isAdmin||draft.length<1||draft.length>3)return;const sessionId=settings.sessionId||'initial';try{await db.ref('current_ballots/'+member).transaction(old=>{const prior=old?.sessionId===sessionId?old:null,ids=[...new Set([...(prior?.clientIds||[]),clientId])];return{memberName:name(member),books:[...draft],sessionId,clientIds:ids,duplicateWarning:ids.length>1,updatedAt:Date.now()}})}catch(e){onError(e)}}
async function addMember(e){e.preventDefault();if(!isAdmin)return;const value=$('member-name').value.trim();if(!value)return;if(Object.values(roster).some(x=>(typeof x==='string'?x:x?.name||'').toLowerCase()===value.toLowerCase())){$('feedback').textContent=value;return}try{await db.ref('member_roster').push().set({name:value,createdAt:Date.now()});$('member-name').value='';$('feedback').textContent='Saved.'}catch(e){onError(e)}}
async function removeMember(id){if(!isAdmin)return;try{await db.ref().update({['member_roster/'+id]:null,['current_session_members/'+id]:null,['current_ballots/'+id]:null})}catch(e){onError(e)}}
function rosterView(){const entries=Object.entries(roster).sort((a,b)=>name(a[0]).localeCompare(name(b[0])));$('roster-list').innerHTML=entries.map(([id])=>`<p class="flex justify-between border px-3 py-2 text-sm"><span>${esc(name(id))}</span><button onclick="removeMember('${esc(id)}')" class="rounded px-3 py-1 underline">${t('remove')}</button></p>`).join('')||`<p class="text-sm text-neutral-500">${t('emptyRoster')}</p>`;const select=$('proposer'),old=select.value;select.innerHTML='<option value="">'+t('choose')+'</option>'+entries.map(([id])=>`<option value="${esc(id)}">${esc(name(id))}</option>`).join('');if(roster[old])select.value=old}
async function addBook(e){e.preventDefault();if(!isAdmin)return;const title=$('book-title').value.trim(),id=$('proposer').value;if(!title||!roster[id])return;try{await db.ref('books_pool').push().set({title,proposer:name(id),proposerId:id,active:false,bonusPoints:0,missedCount:0,createdAt:Date.now()});$('book-title').value=''}catch(e){onError(e)}}
async function setActive(id,value){if(!isAdmin)return;try{await db.ref('books_pool/'+id+'/active').set(value)}catch(e){onError(e)}}
async function deleteBook(id){if(!isAdmin||!confirm(t('removeConfirm')))return;try{await db.ref('books_pool/'+id).remove()}catch(e){onError(e)}}
function poolView(){const entries=Object.entries(books).sort((a,b)=>String(a[1]?.title).localeCompare(String(b[1]?.title)));$('pool-list').innerHTML=entries.map(([id,b])=>`<div class="flex items-center justify-between gap-2 rounded border px-3 py-3"><span class="min-w-0"><b class="serif block">${esc(b.title)}</b><small class="text-neutral-500">${esc(b.proposer||'')}</small></span><span class="flex shrink-0 items-center gap-2"><button onclick="setActive('${esc(id)}',${!b.active})" class="rounded border px-3 py-2 text-xs">${b.active?t('bench'):t('activate')}</button><button onclick="deleteBook('${esc(id)}')" class="px-2 text-xs underline">${t('remove')}</button></span></div>`).join('')||`<p class="text-sm text-neutral-500">${t('emptyPool')}</p>`}
function attendeeView(){const entries=Object.entries(roster).sort((a,b)=>name(a[0]).localeCompare(name(b[0])));$('attendee-list').innerHTML=entries.map(([id])=>`<label class="flex cursor-pointer items-center gap-3 rounded border px-3 py-3"><input type="checkbox" ${attendees[id]===true?'checked':''} onchange="toggleAttendee('${esc(id)}',this.checked)" class="h-4 w-4 accent-[#71363C]"><span>${esc(name(id))}</span></label>`).join('')||`<p class="text-sm text-neutral-500">${t('emptyRoster')}</p>`}
function attendeeCount(){return Object.values(attendees).filter(Boolean).length}
async function toggleAttendee(id,checked){if(!isAdmin||!roster[id])return;try{if(checked)await db.ref('current_session_members/'+id).set(true);else await db.ref().update({['current_session_members/'+id]:null,['current_ballots/'+id]:null});render()}catch(e){onError(e)}}
function auditView(){const current=currentBallots(),entries=Object.entries(roster).filter(([id])=>attendees[id]===true);$('audit-summary').textContent=entries.filter(([id])=>current[id]).length+' / '+entries.length+' '+t('participated');$('audit-list').innerHTML=entries.sort((a,b)=>name(a[0]).localeCompare(name(b[0]))).map(([id])=>{const b=current[id],n=b?.clientIds?.length||0;return `<p class="flex justify-between gap-2 rounded border px-3 py-3 text-sm"><span>${esc(name(id))}</span><span>${b?t('voted'):t('notVoted')}${n>1?` · <b>${t('dupe')} (${n} ${t('devices')})</b>`:''}</span></p>`}).join('')||`<p class="text-sm text-neutral-500">${t('noAttendees')}</p>`}
async function toggleLock(){if(!isAdmin)return;try{await db.ref('settings/locked').set(!settings.locked)}catch(e){onError(e)}}
async function toggleHistoryAccess(){if(!isAdmin)return;try{await db.ref('settings/membersCanViewHistory').set(settings.membersCanViewHistory!==true)}catch(e){onError(e)}}
async function finalize(){if(!isAdmin||resultInProgress)return;if(!settings.locked){$('feedback').textContent=t('closeFirst');return}if(pendingResults?.sessionId===(settings.sessionId||'initial')){if(pendingResults.wildcardCandidates?.length&&!pendingResults.winners?.length)return;await db.ref('settings/showResults').set(settings.showResults!==true);return}const score=scoreMap(),all=Object.entries(books).filter(([,b])=>b.active===true).map(([id,b])=>({id,...b,total:(score[id]||0)+(Number(b.bonusPoints)||0)})).sort((a,b)=>b.total-a.total||(b.missedCount||0)-(a.missedCount||0));if(all.length<3){$('feedback').textContent=t('needBooks');return}resultInProgress=true;try{const winners=all.slice(0,2).map(b=>({id:b.id,title:b.title,proposer:b.proposer,totalScore:b.total,winReason:'top'})),rest=all.slice(2),protectedBook=rest.filter(b=>(b.missedCount||0)>=2).sort((a,b)=>(b.missedCount||0)-(a.missedCount||0))[0];const payload={sessionId:settings.sessionId||'initial',sessionNumber:settings.sessionNumber||1,sessionDate:settings.sessionDate||new Date().toISOString().slice(0,10),preparedAt:Date.now(),winners};if(protectedBook){payload.winners.push({id:protectedBook.id,title:protectedBook.title,proposer:protectedBook.proposer,totalScore:protectedBook.total,winReason:'protected'});await completeResults(payload)}else{payload.wildcardCandidates=rest.map(b=>({id:b.id,title:b.title,proposer:b.proposer,totalScore:b.total}));await db.ref('pending_results').set(payload);$('feedback').textContent=t('drawReady')}}catch(e){onError(e)}finally{resultInProgress=false}}
async function playWildcardDraw(){if(!isAdmin||!pendingResults?.wildcardCandidates?.length||pendingResults.winners?.length)return;const candidates=pendingResults.wildcardCandidates;$('draw-btn').disabled=true;for(let i=0;i<18;i++){const shown=candidates[i%candidates.length];$('draw-status').textContent=shown.title;await new Promise(resolve=>setTimeout(resolve,90+i*8))}const n=2**32,limit=n-n%candidates.length;let random;do{random=crypto.getRandomValues(new Uint32Array(1))[0]}while(random>=limit);const chosen=candidates[random%candidates.length];const result={...pendingResults,winners:[...pendingResults.winners,{...chosen,winReason:'wild'}],drawnAt:Date.now(),drawnDate:new Date().toISOString().slice(0,10)};await completeResults(result);$('draw-status').textContent=`${t('drawn')}: ${chosen.title} · ${formatDate(result.drawnAt)}`;$('draw-btn').disabled=false}
async function completeResults(result){if(settings.archivedSessionId===result.sessionId)return;const archivedAt=Date.now(),key=db.ref('history').push().key,updates={pending_results:{...result,archivedAt},['history/'+key]:{...result,archivedAt,date:new Date(result.drawnAt||result.preparedAt||archivedAt).toISOString().slice(0,10)},'settings/showResults':true,'settings/locked':true,'settings/archivedSessionId':result.sessionId};const winners=new Set(result.winners.map(w=>w.id));Object.entries(books).forEach(([id,b])=>{updates['books_pool/'+id+'/lastStatus']=winners.has(id)?'selected':'carried';updates['books_pool/'+id+'/bonusPoints']=winners.has(id)?0:(Number(b.bonusPoints)||0)+1;updates['books_pool/'+id+'/missedCount']=winners.has(id)?0:(Number(b.missedCount)||0)+1});try{await db.ref().update(updates);$('feedback').textContent=t('archived')}catch(e){onError(e)}}
async function startNextSession(){if(!isAdmin||!pendingResults?.winners?.length||pendingResults.sessionId!==(settings.sessionId||'initial'))return;const nextNumber=(Number(settings.sessionNumber)||Object.keys(history).length||1)+1;const nextSettings={...settings,sessionId:crypto.randomUUID(),sessionNumber:nextNumber,sessionDate:new Date().toISOString().slice(0,10),locked:false,showResults:false,archivedSessionId:null};const updates={settings:nextSettings,current_ballots:null,pending_results:null,current_session_members:null};Object.keys(books).forEach(id=>updates['books_pool/'+id+'/active']=false);try{await db.ref().update(updates);draft=[];tab('vote');adminTab('overview')}catch(e){onError(e)}}
function resultsView(){const closed=!isAdmin&&settings.locked===true,visible=closed||(settings.showResults===true&&pendingResults?.winners?.length);$('results').hidden=!visible;if(!visible)return;$('billboard-title').textContent=closed&&!(settings.showResults&&pendingResults?.winners?.length)?t('closedBoard'):t('winners');const dateLabel=pendingResults?.drawnAt?`${t('drawn')} ${formatDate(pendingResults.drawnAt)}`:formatDate(pendingResults?.sessionDate||settings.sessionDate);$('billboard-member').textContent=[member?`${t('member')}: ${name(member)}`:'',`${t('session')} ${pendingResults?.sessionNumber||settings.sessionNumber||1}`,dateLabel].filter(Boolean).join(' · ');$('winner-list').innerHTML=settings.showResults&&pendingResults?.winners?.length?pendingResults.winners.map(b=>`<article class="rounded border border-white/20 bg-white/10 p-4"><p class="text-xs uppercase text-neutral-300">${t(b.winReason)}</p><h3 class="serif mt-2 text-lg">${esc(b.title)}</h3><p class="text-sm text-neutral-300">${esc(b.proposer||'')}</p></article>`).join(''):`<p class="rounded border border-white/20 p-4 text-sm text-neutral-200">${t('waitingResults')}</p>`}
function historyView(){const entries=Object.values(history).sort((a,b)=>(b.archivedAt||0)-(a.archivedAt||0));$('history-list').innerHTML=entries.length?entries.map((s,i)=>`<article class="rounded-xl border border-[#E2E0D8] bg-white p-5"><div class="mb-4 flex justify-between border-b pb-3"><b>${t('session')} ${s.sessionNumber||entries.length-i} · ${esc(s.date||'')}</b><span>${entries.length-i}</span></div><div class="grid gap-3 sm:grid-cols-3">${(s.winners||[]).map(b=>`<div class="rounded bg-[#F7F6F2] p-4"><p class="text-xs uppercase text-neutral-500">${t(b.winReason)}</p><p class="serif mt-2 text-lg">${esc(b.title)}</p><p class="text-sm text-neutral-500">${esc(b.proposer||'')}</p></div>`).join('')}</div></article>`).join(''):`<p class="rounded border bg-white p-8 text-center text-neutral-500">${t('noHistory')}</p>`}
function tab(which){const vote=which==='vote';$('vote-view').hidden=!vote;$('history-view').hidden=vote||(!isAdmin&&!settings.membersCanViewHistory);$('cast-bar').hidden=!vote||!member||!!settings.locked||isAdmin;$('nav-vote').className='flex-1 border-b-2 py-3 '+(vote?'border-white':'border-transparent text-neutral-400');$('nav-history').className='flex-1 border-b-2 py-3 '+(!vote?'border-white':'border-transparent text-neutral-400')}
setLang(lang);
</script></body></html>
